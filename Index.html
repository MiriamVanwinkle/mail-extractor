<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-80 bg-white border-r border-gray-200 flex flex-col h-full shadow-sm z-10">
    <div class="p-6 border-b border-gray-100 flex items-center gap-3">
      <div class="bg-blue-600 text-white p-2 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
      </div>
      <h1 class="text-xl font-bold text-gray-900 tracking-tight">MailExtractor Pro</h1>
    </div>

    <div class="p-6 flex-1 overflow-y-auto space-y-6">
      
      <!-- ✅ Account Selector -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Select Account</label>
        <div class="relative">
          <select id="accountSelect" class="w-full appearance-none bg-gray-50 border border-gray-300 text-gray-700 py-2.5 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm font-medium">
            <option value="current">Loading accounts...</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
        <p class="text-xs text-gray-500 mt-1">Using Apps Script (Current Account Only).</p>
      </div>

      <!-- Category -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Email Category</label>
        <div class="relative">
          <select id="category" class="w-full appearance-none bg-gray-50 border border-gray-300 text-gray-700 py-2.5 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm font-medium">
            <option value="All" selected>All Categories</option>
            <option value="Primary">Primary</option>
            <option value="Social">Social</option>
            <option value="Promotions">Promotions</option>
            <option value="Updates">Updates</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>

      <!-- Count -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Email Count</label>
        <input type="number" id="count" value="20" min="1" max="100" class="w-full bg-gray-50 border border-gray-300 text-gray-700 py-2.5 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
      </div>

      <!-- Button -->
      <button onclick="startExtraction()" id="extractBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm transition-colors duration-200 flex justify-center items-center gap-2">
        <span id="btnText">Extract Emails</span>
        <svg id="btnSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      </button>

      <div id="statusMessage" class="text-center text-sm font-medium mt-2"></div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <header class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm">
      <h2 class="text-lg font-bold text-gray-800">Extracted Emails</h2>
      <span id="resultCount" class="bg-gray-100 text-gray-600 text-xs font-bold px-3 py-1 rounded-full border border-gray-200">0 Results</span>
    </header>

    <div class="flex-1 overflow-auto p-8">
      <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-xs uppercase tracking-wider text-gray-500 font-semibold">
              <th class="px-6 py-4">From Name</th>
              <th class="px-6 py-4">From Email</th>
              <th class="px-6 py-4">Source</th>
              <th class="px-6 py-4">Subject</th>
              <th class="px-6 py-4">Auth (SPF/DKIM/DMARC)</th>
              <th class="px-6 py-4">Links</th>
              <th class="px-6 py-4">Date</th>
            </tr>
          </thead>
          <tbody id="resultsTable" class="divide-y divide-gray-100 text-sm text-gray-700">
            <tr>
              <td colspan="7" class="px-6 py-12 text-center text-gray-400">
                <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                No data yet. Configure settings and click Extract.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <?!= include('JavaScript'); ?>
</body>
</html>
